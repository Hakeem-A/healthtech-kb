services:
  postgres:
    image: postgres:16-alpine
    container_name: healthtech-kb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-healthtech_kb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-healthtech_kb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: healthtech-kb-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-healthtech_kb}
      SECRET_KEY: ${SECRET_KEY:-insecure-dev-secret-key-replace-in-prod}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
      WIDGET_API_KEYS: ${WIDGET_API_KEYS:-demo-widget-api-key}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python seed_db.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: healthtech-kb-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  postgres_data:
